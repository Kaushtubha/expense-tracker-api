services:
  api:
    build: .
    container_name: expense-tracker-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/expense_tracker
      - JWT_SECRET=supersecret_docker_compose_production_jwt_key
      - JWT_EXPIRES_IN=7d
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - expense-network

  mongo:
    image: mongo:7.0
    container_name: expense-tracker-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - expense-network

volumes:
  mongo-data:

networks:
  expense-network:
    driver: bridge
