services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hostel-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/hostel_tracker
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=hostel_production_super_secret_jwt_access_token_key_2026
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_SECRET=hostel_production_super_secret_jwt_refresh_token_key_2026
      - JWT_REFRESH_EXPIRES_IN=7d
      - ENABLE_REDIS=true
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - hostel-network

  mongo:
    image: mongo:7.0
    container_name: hostel-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - hostel-network

  redis:
    image: redis:7-alpine
    container_name: hostel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hostel-network

volumes:
  mongo-data:
  redis-data:

networks:
  hostel-network:
    driver: bridge
